services:

  orchestrator:
    build:
      context: ../harness/services/orchestrator/claude
    environment:
      AGENT_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      AGENT_MODEL: ${CLAUDE_MODEL:-}
    ports:
      - "7000:8000"

  feedback:
    build:
      context: ../harness/services/feedback/discord
    depends_on:
      - orchestrator
    environment:
      SECRET_KEY: ${DISCORD_BOT_KEY:?DISCORD_BOT_KEY is required}
      CHANNEL_ID: ${DISCORD_CHANNEL:?DISCORD_CHANNEL is required}
      ROBOT_NAME: ${POSTING_AS_NAME:?POSTING_AS_NAME is required}
      ENDPOINT_URL: http://feedback:8000/mcp
      MESSAGES_URL: http://orchestrator:8000/messages
      REGISTRY_URL: http://orchestrator:8000/registry
    ports:
      - "7001:8000"

  shell:
    build:
      context: ../harness/services/shell/bash
    depends_on:
      - orchestrator
    environment:
      ENDPOINT_URL: http://shell:8000/mcp
      REGISTRY_URL: http://orchestrator:8000/registry
    ports:
      - "7002:8000"
    volumes:
      - ./working:/working
